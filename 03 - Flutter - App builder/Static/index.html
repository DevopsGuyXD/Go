<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Boost msme app builder</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  </head>
  <body>
    <div class="container">

      <h1>Boost msme app builder</h1>

      <form action="/api/bizapp/create" method="POST" enctype="multipart/form-data">

        <div class="form-group">
          <label for="FPTAG">FP Tag</label>
          <input type="text" class="form-control" id="FPTAG" placeholder="FPTAG" name="FPTAG" required>
        </div>

        <div class="form-group">
          <label for="FPROOTALIASURI">FP Root Alias URI</label>
          <input type="text" class="form-control" id="FPROOTALIASURI" placeholder="FPROOTALIASURI" name="FPROOTALIASURI" required>
        </div>

        <div class="form-group">
          <label for="FPLOGOURI">FP Logo URI</label>
          <input type="text" class="form-control" id="FPLOGOURI" placeholder="FPLOGOURI"  name="FPLOGOURI" required>
        </div>

        <div class="form-group">
            <label for="FPLOGOBACKGROUNDCOLOR">FP logo background color</label>
            <input type="text" class="form-control" id="FPLOGOBACKGROUNDCOLOR" placeholder="FPLOGOBACKGROUNDCOLOR" name="FPLOGOBACKGROUNDCOLOR" required>
          </div>
  
          <div class="form-group">
            <label for="FPLOGOFOREGROUNDCOLOR">FP logo foreground color</label>
            <input type="text" class="form-control" id="FPLOGOFOREGROUNDCOLOR" placeholder="FPLOGOFOREGROUNDCOLOR" name="FPLOGOFOREGROUNDCOLOR" required>
          </div>
  
          <div class="form-group">
            <label for="VERSION">Version</label>
            <input type="text" class="form-control" id="VERSION" placeholder="VERSION" name="VERSION" required>
          </div>
  
          <div class="form-group">
            <label for="UPLOADLOGOIMAGE">Upload logo image</label>
            <input type="file" class="form-control" id="UPLOADLOGOIMAGE" name="UPLOADLOGOIMAGE" placeholder="UPLOADLOGOIMAGE">
          </div>

        <button type="submit" class="btn btn-primary">Submit</button>

      </form>
  </body>
</html>
